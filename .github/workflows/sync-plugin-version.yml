name: Sync marketplace packaging

# 벤더별 패키징(Claude 심볼릭 링크판 / Codex 플랫 복사판)을 원본(skills/**)과
# plugin.json 버전이 어긋나지 않게 유지하는 워크플로우.
#
# 1) skills/** 이 바뀌면 marketplace/codex/**의 플랫 복사본을 원본과 다시 맞춘다
#    (Codex는 심볼릭 링크를 못 읽어서 파일을 통째로 복사해 둬야 한다).
# 2) plugin.json이 바뀌면 벤더별 버전 중 가장 높은 값으로 나머지를 맞춘다.
#
# 사람이 고치든, Claude Code가 고치든, Codex 자동화가 고치든 — 누가 원본을
# 고쳐도 나머지 패키징이 곧 따라온다.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "marketplace/**/plugin.json"
      - "tools/sync_plugin_version.py"
      - "tools/build_codex_package.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    # 이 워크플로우 자신이 만든 커밋이 다시 push를 트리거해서 무한 루프가
    # 되는 걸 막는다.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Codex package from skill source
        id: build_codex
        run: |
          set +e
          python3 tools/build_codex_package.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Sync plugin.json versions
        id: sync_version
        run: |
          set +e
          python3 tools/sync_plugin_version.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.build_codex.outputs.exit_code == '1' || steps.sync_version.outputs.exit_code == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'marketplace/**' '**/plugin.json'
          git commit -m "chore: sync marketplace packaging [skip ci]"
          git push
