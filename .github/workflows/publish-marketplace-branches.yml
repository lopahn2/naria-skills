name: Publish OpenAI marketplace branch
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tools/build_marketplace_branch.py"
      - ".github/workflows/publish-marketplace-branches.yml"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish-openai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build OpenAI marketplace branch
        run: |
          set -euo pipefail
          branch="openai-marketplace"
          git fetch origin "$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git worktree add "../$branch" "origin/$branch"
          else
            git worktree add --detach "../$branch"
            git -C "../$branch" switch --orphan "$branch"
          fi
          python3 tools/build_marketplace_branch.py --output "../$branch" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          git -C "../$branch" add --all
          if git -C "../$branch" diff --cached --quiet; then exit 0; fi
          git -C "../$branch" config user.name "github-actions[bot]"
          git -C "../$branch" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "../$branch" commit -m "chore: publish OpenAI marketplace from ${GITHUB_SHA::12}"
          git -C "../$branch" push origin "HEAD:refs/heads/$branch"
